format: proprietary
note: 'BVNK publishes a code registry, not RFC 9457 problem+json. Two envelopes are in use: the current URN-style
  codes (bvnk:<domain>:<nnnn>) and a legacy MER-<AREA>-<nnnn> errorList envelope. Codes are grouped by numeric range
  in the published reference; the range and area headings are preserved verbatim.'
envelope:
  current:
    fields:
    - code
    - status
    - traceId
    - message
    - details
    details_fields:
    - errors
    - documentLink
  legacy:
    fields:
    - requestId
    - errorList
    errorList_fields:
    - requestId
    - code
    - parameter
    - message
