  package_name: layer1-mcp-digital
  version: 1.0.0
  transport: stdio
  repository: https://github.com/bvnk/layer1-mcp-digital
  license: MIT
  runtime: Node.js 18+
  sdk: '@modelcontextprotocol/sdk ^1.0.0'
