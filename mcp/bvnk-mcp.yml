  - reference
  source_operation: openapi/bvnk-layer1-digital-asset-openapi-original.yml#createAddress
  rest: POST /digital/v1/addresses
- name: list_transactions
  description: List transactions for the asset pool
  required: []
  source_operation: openapi/bvnk-layer1-digital-asset-openapi-original.yml#listTransactions
  rest: GET /digital/v1/transactions
