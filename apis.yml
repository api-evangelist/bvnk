    url: openapi/bvnk-api-endpoints-openapi-original.yml
  - type: Overlay
    url: overlays/bvnk-api-endpoints-overlay.yaml
  - type: Documentation
    url: https://docs.bvnk.com/bvnk/api-explorer/endpoints/bvnk-api-endpoints
  - type: Postman
    url: https://docs.bvnk.com/postman/bvnk-api-endpoints.postman_collection.json
- aid: bvnk:bvnk-cards-api
  name: BVNK Cards API
  description: The BVNK Cards API issues and manages virtual cards linked to BVNK wallets — card creation,
    renewal, cancellation, freeze/unfreeze, spend limits, eligibility checks, sensitive-card-detail tokens,
    card transactions and dispute eligibility — plus sandbox-only endpoints to simulate authorizations
    and transaction state changes.
  humanURL: https://docs.bvnk.com/bvnk/api-explorer/cards/cards-api
  baseURL: https://api.bvnk.com
  tags:
  - Cards
  - Issuing
  - Payments
  properties:
  - type: Documentation
    url: https://docs.bvnk.com/bvnk/api-explorer/cards/cards-api
- aid: bvnk:layer1-digital-asset-api
  name: Layer1 Digital Asset API
  description: Layer1 is BVNK's institutional digital-asset platform. The Digital Asset API manages asset
    pools, blockchain addresses and key pairs, transaction requests, staking, returns, fee estimation,
    transfer screening and balance exports across Ethereum, Bitcoin, Tron, Solana, Polygon and other networks.
    It is secured with OpenID Connect / OAuth 2.0 client credentials against a Keycloak realm plus RFC
    9421 HTTP Message Signatures.
  humanURL: https://docs.layer1.com/reference/api-authentication
  baseURL: https://api.layer1.com
  tags:
  - Digital Assets
  - Custody
  - Blockchain
  - Treasury
  properties:
