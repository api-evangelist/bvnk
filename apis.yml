aid: bvnk
name: BVNK
description: BVNK is a stablecoin payments infrastructure company that lets businesses move money between
  fiat and stablecoins over a single API. The platform covers merchant crypto payment collection through
  payment links and blockchain channels, embedded stablecoin wallets and named virtual accounts (vIBAN)
  in EUR, GBP and USD, fiat pay-ins and payouts over SWIFT, ACH, Fedwire and local rails, on-ramp and
  off-ramp conversion, card issuing, treasury and trading, plus customer onboarding, compliance and Travel
  Rule workflows. Developers integrate over a REST API authenticated with Hawk HMAC-SHA256 request signing,
  with webhooks for every payment, wallet, card and onboarding lifecycle event, a full sandbox with a
  payment simulator, and a Postman collection generated from the OpenAPI. BVNK operates as a regulated
  EMI in the UK (FCA) and Malta (MFSA), is ISO 27001:2022 and SOC 2 Type II certified, and also runs the
  Layer1 institutional digital-asset platform.
