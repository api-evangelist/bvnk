apis:
- aid: bvnk:bvnk-api
  name: BVNK API
  description: The BVNK REST API for payments, blockchain payment channels, wallets, virtual accounts,
    merchant IDs, currencies and trading/conversion quotes. Requests are authenticated with Hawk (HMAC-SHA256)
    request signing using a Hawk Auth ID and Hawk Auth Key issued from the BVNK portal. Sandbox and production
    share the same surface at api.sandbox.bvnk.com and api.bvnk.com.
  humanURL: https://docs.bvnk.com/bvnk/api-explorer/endpoints/bvnk-api-endpoints
  baseURL: https://api.bvnk.com
  tags:
  - Payments
  - Wallets
  - Channels
  - Currencies
  - Trading
  properties:
