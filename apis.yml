apis:
- aid: bvnk:bvnk-cards-api
  name: BVNK Cards API
  description: >-
    The BVNK Cards API issues and manages virtual cards linked to BVNK wallets — card creation, renewal,
    cancellation, freeze/unfreeze, spend limits, eligibility checks, sensitive-card-detail tokens, card
    transactions and dispute eligibility — plus sandbox-only endpoints to simulate authorizations and
    transaction state changes.
  humanURL: https://docs.bvnk.com/bvnk/api-explorer/cards/cards-api
